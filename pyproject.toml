[project]
name = "omnetic-jwt-generator"
version = "1.0.0"
description = "Generate signed RS256 JWT tokens for authenticating Omnetic DMS Service Account requests."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Omnetic" }]
dependencies = [
    "pyjwt[crypto]>=2.8,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnetic_jwt_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
